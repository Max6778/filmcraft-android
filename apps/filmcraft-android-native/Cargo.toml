[package]
name = "filmcraft-android-native"
description = "JNI bridge from the Android app to the FilmCraft Rust editing session"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "filmcraft_android"
crate-type = ["cdylib"]

[lints.rust]
# Match the workspace lint set while allowing only the JNI module's exported-symbol annotations.
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
filmcraft-engine = { workspace = true }
serde_json = { workspace = true }
jni = "0.21.1"
